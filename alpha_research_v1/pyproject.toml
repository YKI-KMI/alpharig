[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpharig"
version = "0.1.0"
description = "Leakage-proof automated cross-sectional equity alpha research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "alpharig contributors" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "typer>=0.9",
    "pyarrow>=14.0",
    "duckdb>=0.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.90"]
yfinance = ["yfinance>=0.2.40"]

[project.scripts]
alpharig = "alpharig.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
